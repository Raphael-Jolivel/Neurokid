# ============================================================
# NeuroKid - LANCEMENT LOCAL (1 seul fichier, 1 seule commande)
# ============================================================
#
# Lance d'un coup : MariaDB + phpMyAdmin + API Flask + Front Angular.
#
#   docker compose up -d --build
#
# URLs :
#   Front Angular   : http://localhost:4200
#   API (direct)    : http://localhost:5000/health
#   phpMyAdmin      : http://localhost:8080  (root / root)
#
# Compte admin de l'app : admin / admin123
# ============================================================

services:

  # ---------- Base de donnees MariaDB ------------------------
  db:
    image: mariadb:11
    container_name: neurokid-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE:      ${MARIADB_DATABASE}
    volumes:
      - db-data:/var/lib/mysql
      # Seul 01-init.sql est joue automatiquement (creation BDD vierge).
      # Le 02-migrate-* sert UNIQUEMENT pour migrer une BDD existante.
      - ./neurokid-db/sql/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${DB_PORT_HOST:-3306}:3306"
    networks:
      - neurokidnet
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------- phpMyAdmin (admin de la BDD) -------------------
  phpmyadmin:
    image: phpmyadmin:5
    container_name: neurokid-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST:     db
      PMA_PORT:     "3306"
      PMA_USER:     ${DB_USER}
      PMA_PASSWORD: ${DB_PASSWORD}
      UPLOAD_LIMIT: 64M
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    networks:
      - neurokidnet
    depends_on:
      db:
        condition: service_healthy

  # ---------- API Flask --------------------------------------
  api:
    build:
      context: ./neurokid-back/neurokid_api
    container_name: neurokid-api
    restart: unless-stopped
    environment:
      DB_HOST:      ${DB_HOST}
      DB_PORT:      ${DB_PORT}
      DB_USER:      ${DB_USER}
      DB_PASSWORD:  ${DB_PASSWORD}
      DB_NAME:      ${DB_NAME}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LLM_URL:      ${LLM_URL}
      LLM_MODEL:    ${LLM_MODEL}
      FLASK_DEBUG:  "0"
    ports:
      - "${API_PORT:-5000}:5000"
    networks:
      - neurokidnet
    depends_on:
      db:
        condition: service_healthy

  # ---------- Front Angular (build + nginx) ------------------
  web:
    build:
      context: ./neurokid-front
    container_name: neurokid-web
    restart: unless-stopped
    environment:
      API_URL: ${API_URL}
    ports:
      - "${FRONT_PORT:-4200}:80"
    networks:
      - neurokidnet
    depends_on:
      - api

networks:
  neurokidnet:
    driver: bridge

volumes:
  db-data:
    driver: local
