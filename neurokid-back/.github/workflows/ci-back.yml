# ============================================================
# CI Back - lint Python + tests + build de l'image Docker
# ============================================================
# Se déclenche :
#   - sur chaque push de la branche `back`
#   - sur chaque pull request ciblant `back`
#   - manuellement depuis l'onglet Actions (workflow_dispatch)
#
# REMARQUE : on ne déploie PAS automatiquement sur les VMs.
# Les VMs du labo ne sont accessibles que sur le VPN école et
# ne sont donc pas joignables depuis les runners hébergés par
# GitHub. Le déploiement se fait à la main sur la VM Back :
#
#   ssh user@VM_BACK
#   cd ~/neurokid-back
#   git pull
#   docker compose up -d --build
#
# Si plus tard vous installez un self-hosted runner sur la VM,
# décommentez le job `deploy` en bas du fichier.
# ============================================================

name: CI Back

on:
  push:
    branches: [back]
  pull_request:
    branches: [back]
  workflow_dispatch:

jobs:

  lint-test:
    name: Lint Python + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: neurokid_api/requirements.txt

      - name: Install dependencies
        working-directory: neurokid_api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint with ruff
        working-directory: neurokid_api
        run: ruff check . || true   # ne casse pas la CI tant que le code n'a pas été linté

      - name: Compile sources
        working-directory: neurokid_api
        run: python -m compileall -q .

      - name: Run tests (si présents)
        working-directory: neurokid_api
        run: |
          if [ -d tests ] || ls test_*.py 2>/dev/null; then
            pytest -q
          else
            echo "Pas de tests pour le moment."
          fi

  docker-build:
    name: Build image Docker
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./neurokid_api
          push: false
          tags: neurokid-api:ci

      - name: Smoke test image
        run: |
          docker images neurokid-api:ci

  # ----------------------------------------------------------------
  # Déploiement manuel uniquement (VPN école -> pas d'accès depuis
  # les runners GitHub-hosted). À activer si vous installez un
  # self-hosted runner sur la VM Back.
