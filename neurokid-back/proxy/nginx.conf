# ------------------------------------------------------------
# Reverse proxy local de la VM Back.
#
# - Expose http://VM_BACK/api/...
# - Réécrit le préfixe /api/ vers l'API Flask (qui écoute en interne
#   sur api:5000 et n'expose pas son port à l'extérieur).
# - Ajoute des en-têtes de sécurité de base.
#
# Le navigateur appelle directement cette VM (séparée de la VM Front).
# ------------------------------------------------------------

server {
    listen 80;
    server_name _;

    # ----- En-têtes de sécurité ----------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ----- Endpoint de santé -------------------------------------------
    # /health proxifie directement vers /health de Flask (pas de prefix).
    location = /health {
        proxy_pass http://api:5000/health;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----- API ----------------------------------------------------------
    # Le préfixe /api/ est retiré avant d'envoyer la requête à Flask
    # (par ex. /api/login -> /login côté API).
    location /api/ {
        proxy_pass http://api:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts un peu plus généreux pour /session/.../answer.
        proxy_read_timeout 60s;
    }

    # Page d'accueil minimaliste (utile pour vérifier la VM rapidement).
    location = / {
        default_type text/plain;
        return 200 "NeuroKid API gateway. Use /api/... or /health.\n";
    }
}
