server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de sécurité.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline' 'unsafe-eval'; style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' http://localhost:5000 http://localhost:8080; frame-ancestors 'self';" always;

    # Assets hashés -> cache long.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Le fichier de configuration runtime ne doit JAMAIS être caché,
    # sinon une apiUrl obsolète pourrait subsister après redéploiement.
    location = /config.json {
        add_header Cache-Control "no-store" always;
        try_files /config.json =404;
    }

    # Endpoint de santé local (utile pour le HEALTHCHECK Docker).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fallback SPA : toute URL inconnue sert index.html, pour que le
    # routeur Angular résolve la route côté client.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
