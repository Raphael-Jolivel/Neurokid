<h1 class="uk-text-center" style="font-weight: 500">Reset password</h1>

<!-- Step 1: request token -->
<form *ngIf="step === 1" #form1="ngForm" class="form-grid">

  <div>
    <input class="uk-input" name="username" [(ngModel)]="username"
           #u="ngModel" placeholder="Username *" type="text" required/>
    <div class="uk-alert" style="background: rgba(255,0,0,0.05)"
         *ngIf="u.invalid && (u.dirty || u.touched)">
      <div *ngIf="u.errors?.['required']">Username required.</div>
    </div>
  </div>

  <div class="uk-flex uk-flex-middle uk-margin-small" style="gap: 2rem">
    <button class="uk-button uk-button-default" [disabled]="form1.invalid" (click)="requestToken()">
      Request a token
    </button>
    <span class="uk-text-danger">{{ error }}</span>
  </div>
</form>

<!-- Step 2: use the token -->
<form *ngIf="step === 2" #form2="ngForm" class="form-grid">

  <div>
    <input class="uk-input" name="token" [(ngModel)]="token"
           #t="ngModel" placeholder="Reset token *" type="text" required/>
  </div>

  <div>
    <input class="uk-input" name="newPassword" [(ngModel)]="newPassword"
           #np="ngModel" placeholder="New password *" type="password" required minlength="4"/>
    <div class="uk-alert" style="background: rgba(255,0,0,0.05)"
         *ngIf="np.invalid && (np.dirty || np.touched)">
      <div *ngIf="np.errors?.['required']">Password required.</div>
      <div *ngIf="np.errors?.['minlength']">At least 4 characters.</div>
    </div>
  </div>

  <div>
    <input class="uk-input" name="confirmPassword" [(ngModel)]="confirmPassword"
           #cp="ngModel" placeholder="Confirm new password *" type="password" required/>
    <div class="uk-alert" style="background: rgba(255,0,0,0.05)"
         *ngIf="confirmPassword && newPassword !== confirmPassword">
      The passwords do not match.
    </div>
  </div>

  <div class="uk-flex uk-flex-middle uk-margin-small" style="gap: 2rem">
    <button class="uk-button uk-button-default" [disabled]="form2.invalid" (click)="applyReset()">
      Reset password
    </button>
    <span class="uk-text-danger">{{ error }}</span>
  </div>
</form>

<p>Do you remember your password? <a [routerLink]="['/login']" class="no-text-decoration"> --&gt; Login</a></p>
